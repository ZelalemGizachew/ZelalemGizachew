    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#84B3CA" fill-opacity=".11"/></pattern>
  </defs>
  <rect width="1200" height="256" rx="16" fill="url(#surface)"/>
