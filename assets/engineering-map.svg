<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
  <title id="title">Engineering problem spaces</title>
  <desc id="desc">A conceptual map of backend and mobile systems connecting through reliability engineering to payments, realtime voice and open source.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A131D"/><stop offset="1" stop-color="#071019"/></linearGradient>
